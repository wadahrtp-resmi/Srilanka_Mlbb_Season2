
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tournament Mobile Legends SL — Season 1</title>
<style>
:root{
  --bg:#030816;
  --bg2:#061225;
  --panel:#081a31;
  --panel2:#0b223d;
  --line:#21466f;
  --cyan:#00cfff;
  --blue:#168dff;
  --text:#e9f5ff;
  --muted:#9eb5cf;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:
 radial-gradient(circle at 50% 15%,rgba(0,117,255,.16),transparent 28%),
 linear-gradient(180deg,#020817 0%,#040a19 55%,#020712 100%);
 color:var(--text)}
body{overflow-x:hidden}
a{text-decoration:none;color:inherit}

.header{
  height:61px;border-bottom:1px solid #234a73;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 8px 0 9px;
  background:linear-gradient(180deg,#071a32,#040c1c);
  position:relative;z-index:20;
}
.brand{display:flex;align-items:center;gap:10px}
.brand-logo{
  width:40px;height:40px;border-radius:50%;border:1px solid #1d8dca;
  background:radial-gradient(circle,#0b5c96 0,#03152a 55%,#010713 100%);
  display:grid;place-items:center;box-shadow:0 0 12px rgba(0,191,255,.35);
  font-size:21px
}
.brand-text{line-height:1}
.brand-text strong{font-size:14px;letter-spacing:.2px;text-shadow:0 0 7px #39c7ff}
.brand-text small{display:block;font-size:9px;font-weight:700;color:#d8e9f7;margin-top:3px}
.close{
  width:33px;height:33px;border-radius:10px;border:1px solid #3b668e;
  background:linear-gradient(145deg,#123454,#07172a);color:#e8f7ff;
  font-size:26px;line-height:28px;cursor:pointer;box-shadow:inset 0 0 10px rgba(0,156,255,.12)
}
.close:hover{background:#113b60}

.hero-wrap{padding:0 5px}
.hero{
  height:260px;border:1px solid #235b8d;border-radius:14px 14px 0 0;
  overflow:hidden;position:relative;margin-top:0;
  background:
   radial-gradient(circle at 74% 46%,rgba(0,188,255,.25),transparent 20%),
   radial-gradient(circle at 28% 35%,rgba(36,70,255,.3),transparent 25%),
   linear-gradient(110deg,#071b40 0%,#031023 42%,#091d48 67%,#020817 100%);
}
.hero:before{
  content:"";position:absolute;inset:0;opacity:.75;
  background:
   repeating-linear-gradient(125deg,transparent 0 22px,rgba(0,143,255,.10) 23px 25px,transparent 26px 47px),
   linear-gradient(90deg,transparent 0 10%,rgba(0,178,255,.18) 11%,transparent 12% 87%,rgba(0,178,255,.14) 88%,transparent 89%);
}
.hero-art{
  position:absolute;left:0;top:0;bottom:0;width:43%;
  background:
   radial-gradient(circle at 65% 35%,rgba(55,177,255,.7),transparent 8%),
   radial-gradient(circle at 50% 62%,rgba(0,119,255,.35),transparent 30%);
}
.hero-art:after{
  content:"";position:absolute;width:180px;height:180px;left:75px;top:42px;
  border-radius:50%;border:1px solid rgba(0,201,255,.4);
  box-shadow:0 0 35px rgba(0,143,255,.35),inset 0 0 25px rgba(0,201,255,.25);
  transform:rotate(25deg)
}
.hero-copy{
  position:absolute;right:4%;top:21px;width:64%;text-align:center;z-index:2
}
.kicker{
  display:inline-block;padding:5px 17px;border-top:2px solid var(--cyan);
  border-bottom:2px solid var(--cyan);color:#fff;font-size:11px;font-weight:900;
  letter-spacing:1px;background:rgba(0,89,170,.16);clip-path:polygon(7% 0,93% 0,100% 50%,93% 100%,7% 100%,0 50%);
}
.title{
  margin:10px 0 3px;font-weight:1000;font-style:italic;letter-spacing:-2px;
  font-size:48px;line-height:.88;color:#f7fcff;
  -webkit-text-stroke:1px #0d67a7;
  text-shadow:0 3px 0 #0a3b6b,0 0 12px #43c9ff,0 0 26px rgba(0,145,255,.75)
}
.title span{display:block}
.sponsor{
  display:inline-block;margin-top:14px;padding:5px 32px;border:2px solid #00bdf4;
  border-radius:5px;color:#c9f7ff;font-weight:900;font-size:10px;
  background:linear-gradient(180deg,rgba(0,154,255,.22),rgba(0,42,92,.35));
  box-shadow:0 0 12px rgba(0,194,255,.45)
}
.ray{position:absolute;width:130px;height:4px;background:#11bdf8;filter:blur(.4px);opacity:.75}
.r1{left:2%;top:62px;transform:rotate(21deg)} .r2{left:1%;top:125px;transform:rotate(-8deg)}
.r3{right:3%;top:58px;transform:rotate(-16deg)} .r4{right:1%;bottom:35px;transform:rotate(10deg)}

.sponsors{
  margin:35px auto 39px;max-width:667px;height:110px;padding:17px 14px;
  border:1px solid #294c77;border-radius:17px;
  background:linear-gradient(180deg,rgba(11,30,57,.94),rgba(6,18,36,.9));
  box-shadow:0 0 22px rgba(0,88,180,.08),inset 0 0 18px rgba(0,91,173,.08);
  display:grid;grid-template-columns:repeat(5,1fr);gap:11px
}
.sponsor-card{
  min-width:0;border:1px solid #0b8fd3;border-radius:9px;padding:6px;
  background:linear-gradient(180deg,#102a49,#091a31);
  display:flex;align-items:center;justify-content:center;
}
.logo-box{
  width:100%;height:59px;border:1px solid #2b6189;border-radius:7px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(circle,#122e4a,#050f20);
}
.logo-box img{max-width:92%;max-height:86%;object-fit:contain}
.fake-logo{font-weight:900;font-size:16px;letter-spacing:-1px;text-align:center}
.nine{color:#e7d16b}.aliansi{color:#b7f13a}.indo{color:#55c7ff}
.paw{font-size:28px}.gold{font-size:25px}

.footer{
  border-top:1px solid #22476d;min-height:180px;text-align:center;padding-top:17px;
  background:linear-gradient(180deg,#061326 0,#020714 45%)
}
.footer-pill{
  display:inline-block;padding:6px 13px;border:1px solid #1670a9;border-radius:20px;
  color:#00cfff;font-size:9px;font-weight:900;letter-spacing:.4px;
  box-shadow:0 0 14px rgba(0,180,255,.18)
}

.menu{
  position:absolute;right:12px;top:55px;width:181px;padding:8px 6px 9px;
  background:linear-gradient(180deg,#0b2747,#061a31);
  border:1px solid #31648c;border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.55);
  z-index:30;display:none
}
.menu.open{display:block}
.menu a{
  display:block;padding:11px 10px;border-radius:8px;font-size:10px;font-weight:900;
  color:#cbdced;letter-spacing:.2px
}
.menu a:hover,.menu a.active{background:linear-gradient(90deg,#163e62,#0b2a48);color:#fff}
.menu a.active{border:1px solid #00bdf4;box-shadow:0 0 8px rgba(0,191,255,.25)}

@media(max-width:700px){
 .header{height:57px}.brand-text strong{font-size:12px}
 .hero{height:235px}.hero-copy{width:72%;right:1%}.title{font-size:35px}
 .hero-art{width:36%}.sponsors{margin:24px 12px 30px;height:auto;grid-template-columns:repeat(2,1fr)}
 .sponsor-card:last-child{grid-column:1/-1}
 .menu{right:7px}
}
@media(max-width:430px){
 .hero{height:210px}.title{font-size:28px}.kicker{font-size:8px}
 .sponsor{font-size:8px;padding:4px 18px}.hero-art{opacity:.55}
 .menu{width:190px}.sponsors{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<header class="header">
  <div class="brand">
    <div class="brand-logo">⚔</div>
    <div class="brand-text">
      <strong>TOURNAMENT MOBILE LEGENDS SL</strong>
      <small>SEASON 1</small>
    </div>
  </div>
  <button class="close" id="closeBtn" aria-label="Tutup">×</button>
  <nav class="menu" id="menu">
    <a href="#" class="active">BERANDA</a>
    <a href="#tim">TIM</a>
    <a href="#jadwal">JADWAL</a>
    <a href="#klasemen">KLASEMEN</a>
    <a href="#skor">SKOR</a>
    <a href="#mvp">MVP</a>
    <a href="#savage">SAVAGE</a>
    <a href="#playoff">PLAYOFF</a>
    <a href="#rules">RULES TURNAMEN</a>
    <a href="#prizepool">PRIZEPOOL</a>
  </nav>
</header>

<main>
  <section class="hero-wrap">
    <div class="hero">
      <div class="hero-art"></div>
      <div class="ray r1"></div><div class="ray r2"></div><div class="ray r3"></div><div class="ray r4"></div>
      <div class="hero-copy">
        <div class="kicker">《 LET'S PLAY FAIR &amp; FUN 》</div>
        <div class="title"><span>TOURNAMENT</span><span>MOBILE</span><span>LEGENDS SL</span></div>
        <div class="sponsor">SPONSORED BY</div>
      </div>
    </div>
  </section>

  <section class="sponsors" aria-label="Sponsor">
    <div class="sponsor-card"><div class="logo-box"><div class="fake-logo nine">NINE<br><small>ESPORT</small></div></div></div>
    <div class="sponsor-card"><div class="logo-box"><div class="fake-logo aliansi">△ Aliansi TopUp</div></div></div>
    <div class="sponsor-card"><div class="logo-box"><div class="fake-logo indo">▣ INDO CORNER</div></div></div>
    <div class="sponsor-card"><div class="logo-box"><div class="paw">🐾</div></div></div>
    <div class="sponsor-card"><div class="logo-box"><div class="gold">⚔️</div></div></div>
  </section>
</main>

<footer class="footer">
  <div class="footer-pill">TOURNAMENT MOBILE LEGENDS SL — SEASON 1</div>
</footer>

<script>
const menu = document.getElementById('menu');
const closeBtn = document.getElementById('closeBtn');

closeBtn.addEventListener('click', () => {
  menu.classList.toggle('open');
  closeBtn.textContent = menu.classList.contains('open') ? '×' : '☰';
});

document.addEventListener('click', e => {
  if (!menu.contains(e.target) && !closeBtn.contains(e.target)) {
    menu.classList.remove('open');
    closeBtn.textContent = '☰';
  }
});

document.querySelectorAll('.menu a').forEach(a => {
  a.addEventListener('click', () => {
    document.querySelectorAll('.menu a').forEach(x => x.classList.remove('active'));
    a.classList.add('active');
  });
});
</script>
</body>
</html>
