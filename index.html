<div class="playoff-section">
  <button id="togglePlayoff" class="toggle-btn" type="button">
    🏆 Tampilkan Playoff
  </button>

  <div id="playoffContent" class="playoff-content">
    <h2>🔥 PLAYOFF / KNOCKOUT</h2>

    <div class="bracket">

      <div class="round">
        <h3>SEMIFINAL</h3>

        <div class="match">
          <div>🥇 Juara Grup A</div>
          <div>🥈 Runner-up Grup B</div>
          <strong>VS</strong>
        </div>

        <div class="match">
          <div>🥇 Juara Grup B</div>
          <div>🥈 Runner-up Grup A</div>
          <strong>VS</strong>
        </div>
      </div>

      <div class="round">
        <h3>FINAL</h3>

        <div class="match final">
          <div>🏆 Pemenang SF 1</div>
          <div>🏆 Pemenang SF 2</div>
          <strong>VS</strong>
        </div>
      </div>

      <div class="round">
        <h3>CHAMPION</h3>

        <div class="match champion">
          <div>👑 JUARA</div>
          <div>________________</div>
        </div>
      </div>

    </div>
  </div>
</div>

<style>
  .playoff-section {
    margin-top: 40px;
  }

  .toggle-btn {
    display: block;
    margin: auto;
    padding: 14px 24px;
    border: none;
    border-radius: 10px;
    background: #38bdf8;
    color: #0f172a;
    font-weight: bold;
    font-size: 16px;
    cursor: pointer;
  }

  .toggle-btn:hover {
    background: #7dd3fc;
  }

  .playoff-content {
    margin-top: 20px;
    background: #1e293b;
    padding: 25px;
    border-radius: 15px;

    /* Awalnya tertutup */
    display: none;
  }

  .playoff-content.show {
    display: block;
  }

  .playoff-content h2 {
    text-align: center;
    color: #f472b6;
  }

  .bracket {
    display: flex;
    justify-content: space-around;
    align-items: center;
    gap: 25px;
    flex-wrap: wrap;
  }

  .round {
    width: 220px;
  }

  .round h3 {
    text-align: center;
    color: #cbd5e1;
  }

  .match {
    background: #334155;
    padding: 15px;
    margin: 20px 0;
    border-radius: 10px;
    border-left: 4px solid #38bdf8;
  }

  .match div {
    padding: 6px 0;
  }

  .match strong {
    display: block;
    text-align: center;
    color: #94a3b8;
    margin-top: 5px;
  }

  .final {
    border-left-color: #f472b6;
  }

  .champion {
    border-left-color: #facc15;
  }

  @media (max-width: 700px) {
    .bracket {
      flex-direction: column;
    }

    .round {
      width: 100%;
    }
  }
</style>

<script>
  const toggleButton = document.getElementById("togglePlayoff");
  const playoffContent = document.getElementById("playoffContent");

  toggleButton.addEventListener("click", function () {
    playoffContent.classList.toggle("show");

    if (playoffContent.classList.contains("show")) {
      toggleButton.textContent = "🔽 Sembunyikan Playoff";
    } else {
      toggleButton.textContent = "🏆 Tampilkan Playoff";
    }
  });
</script>
